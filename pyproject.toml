[project]
name = "oceanking"
version = "0.0.1"
description = "OceanKing: A Crab, a Crown, and Claude. The Jumper crab robot on the seabed in MuJoCo, trained with RL and driven by Claude"
requires-python = ">=3.10,<3.14"
# Simulation dependencies come from upstream Jumper (`jumper/`), installed
# editable into the same environment; see README.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# The demo agent (oceanking/demo/agent.py) drives the robot through the Claude API.
demo = ["anthropic>=1.0"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["oceanking*"]

[tool.ruff]
line-length = 100
extend-exclude = ["jumper", "scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
